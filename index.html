<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEYMA | Élégance & Voile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* Style de la section d'accueil - Image 100% nette */
        .hero {
            /* CORRECTION : Suppression totale du voile gris/blanc linéaire */
            background: url('asset/img/hero.jpeg') no-repeat center center/cover !important;
            
            height: 80vh; /* Hauteur élégante sur PC */
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="nav-left">
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="hamburger">
                    <span></span>
                    <span></span>
                </label>
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="about.html">À Propos</a></li>
                    <li><a href="shop.html">Boutique</a></li>
                </ul>
            </div>

            <div class="nav-center">
                <a href="index.html" class="logo-gold">KEYMA</a>
            </div>

            <div class="nav-right">
                <a href="cart.html" class="cart-link">PANIER (<span id="cart-count">0</span>)</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <a href="shop.html" class="btn-primary">Explorer la collection</a>
            </div>
        </section>
    </main>
       

    <script>
        // 1. Menu Profil (Toggle)
        function toggleUserMenu(event) {
            event.preventDefault();
            const dropdown = document.getElementById('user-dropdown');
            if (dropdown) {
                dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
            }
        }

        // 2. Fermer le menu si on clique n'importe où ailleurs sur la page
        window.addEventListener('click', function(event) {
            const dropdown = document.getElementById('user-dropdown');
            const userMenu = document.querySelector('.user-menu-container');
            
            if (dropdown && userMenu && !userMenu.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });

        // 3. Gestion de la déconnexion
        function handleLogout() {
            localStorage.removeItem('isLoggedIn'); 
            alert("Vous avez été déconnectée de l'univers KEYMA.");
            window.location.href = 'index.html';
        }

        // 4. Mise à jour du compteur panier
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('keyma_cart')) || [];
            const countElement = document.getElementById('cart-count');
            if (countElement) {
                countElement.innerText = cart.length;
            }
        }

        document.addEventListener('DOMContentLoaded', updateCartCount);
    </script>

</body>
</html>
